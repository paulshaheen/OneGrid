<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OneGrid — Rendering Compare (Current vs Enhanced)</title>
<style>
  :root { color-scheme: dark; }
  html,body { margin:0; height:100%; background:#070b12; overflow:hidden; font-family:-apple-system,Segoe UI,Roboto,sans-serif; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }
  .bar {
    position:fixed; top:14px; left:50%; transform:translateX(-50%);
    display:flex; gap:10px; align-items:center; z-index:10;
    background:rgba(10,16,26,.72); backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.08); border-radius:14px; padding:8px 10px;
  }
  .btn {
    appearance:none; border:1px solid rgba(255,255,255,.14); cursor:pointer;
    color:#eaf1ff; background:rgba(255,255,255,.05); padding:8px 14px;
    border-radius:10px; font-size:13px; font-weight:600; letter-spacing:.2px;
  }
  .btn.primary { background:linear-gradient(180deg,#2b6df0,#1b4fc4); border-color:#3a7bff; }
  .btn:hover { background:rgba(255,255,255,.12); }
  .mode { font-weight:700; font-size:13px; padding:0 6px; min-width:78px; text-align:center; }
  .mode b { color:#37e0d0; }
  .mode.enh b { color:#ffb454; }
  .hint { position:fixed; bottom:12px; left:50%; transform:translateX(-50%); z-index:10;
    font-size:11.5px; color:#9fb0c8; background:rgba(10,16,26,.6); padding:6px 12px; border-radius:10px;
    border:1px solid rgba(255,255,255,.06); }
  .legend { position:fixed; top:14px; right:14px; z-index:10; width:250px;
    background:rgba(10,16,26,.72); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.08);
    border-radius:14px; padding:12px 14px; font-size:12px; color:#c8d4e6; line-height:1.5; }
  .legend h4 { margin:0 0 6px; font-size:12px; color:#eaf1ff; letter-spacing:.3px; }
  .legend .on { color:#7fe3d3; } .legend .off { color:#5b6a80; }
  .loading { position:fixed; inset:0; display:grid; place-items:center; color:#6f819b; z-index:20;
    font-size:14px; letter-spacing:.4px; }
  /* CSS2D sensor labels overlaid on the 3D scene */
  #labels { position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:6; }
  .sensor-lbl { pointer-events:none; transform:translate(-50%,-100%);
    background:rgba(10,14,22,.92); border:1.5px solid #35d69a; border-radius:8px;
    padding:3px 7px; font-size:11px; line-height:1.25; white-space:nowrap;
    box-shadow:0 2px 8px rgba(0,0,0,.4); transition:border-color .2s, box-shadow .2s; }
  .sensor-lbl .nm { display:flex; align-items:center; gap:5px; color:#c7d3e6; font-weight:600; font-size:10px; letter-spacing:.2px; }
  .sensor-lbl .dot { width:6px; height:6px; border-radius:50%; background:#35d69a; }
  .sensor-lbl .val { color:#eaf1f8; font-weight:700; font-size:13px; font-variant-numeric:tabular-nums; margin-top:1px; }
  .sensor-lbl.crit { animation:spulse 1.1s ease-in-out infinite; }
  @keyframes spulse { 0%,100%{ box-shadow:0 0 6px rgba(255,84,112,.4); } 50%{ box-shadow:0 0 18px rgba(255,84,112,.85); } }
</style>
</head>
<body>
<div id="labels"></div>
<div id="app"></div>
<div class="loading" id="loading">Loading Three.js from CDN…</div>
<div class="bar">
  <span class="mode" id="modeLabel">Mode: <b>CURRENT</b></span>
  <button class="btn primary" id="toggle">Switch to Enhanced ▸</button>
  <button class="btn" id="spin">Auto-rotate: On</button>
</div>
<div class="legend" id="legend"></div>
<div class="hint">Drag to orbit · scroll to zoom · <b>hold SPACE</b> to peek the other look · <b>T</b> toggles</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { VignetteShader } from 'three/addons/shaders/VignetteShader.js';
import GUI from 'three/addons/libs/lil-gui.module.min.js';

const appEl = document.getElementById('app');
const loadingEl = document.getElementById('loading');

// ------------------------------------------------------------------ renderer
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance', failIfMajorPerformanceCaveat: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
appEl.appendChild(renderer.domElement);

// CSS2D renderer for sensor labels (DOM overlay — no GPU cost, no post-processing interaction)
const labelRenderer = new CSS2DRenderer({ element: document.getElementById('labels') });
labelRenderer.setSize(innerWidth, innerHeight);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.5, 400);
camera.position.set(15, 9, 17);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.target.set(0, 2.2, 0); controls.maxPolarAngle = Math.PI/2.02;
controls.minDistance = 6; controls.maxDistance = 48;

// environment — procedural room (default) OR real HDRI (loaded on demand)
const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();

// procedural gradient backdrop kept for the "Room / none" background option
const gradBg = (()=>{
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d');
  const rg = g.createRadialGradient(256, 150, 30, 256, 256, 380);
  rg.addColorStop(0, '#243347'); rg.addColorStop(.45,'#16202f'); rg.addColorStop(1,'#070b12');
  g.fillStyle = rg; g.fillRect(0,0,512,512);
  return new THREE.CanvasTexture(c);
})();

const roomRT0 = pmrem.fromScene(new RoomEnvironment(), 0.04);
let roomRT = roomRT0;
scene.environment = roomRT.texture;
scene.background = gradBg;

// HDRI catalog — industrial interiors (Poly Haven) + a few outdoor options.
// Values are full URLs (CORS-enabled: PH sends Access-Control-Allow-Origin: *).
const _PH = 'https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/';
const _TJS = 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r169/examples/textures/equirectangular/';
const HDRI = {
  'Open plains (day)':    _PH+'kloofendal_48d_partly_cloudy_puresky_1k.hdr',
  'Industrial sunset':    _PH+'industrial_sunset_02_puresky_1k.hdr',
  'Clear plains':         _PH+'syferfontein_18d_clear_puresky_1k.hdr',
  'Dirt road (open)':     _PH+'mud_road_puresky_1k.hdr',
  'Machine shop (indoor)':_PH+'machine_shop_01_1k.hdr',
  'Factory yard':         _PH+'factory_yard_1k.hdr',
  'Quarry (outdoor)':     _TJS+'quarry_01_1k.hdr',
  'Venice sunset':        _TJS+'venice_sunset_1k.hdr',
  'Spruit sunrise':       _TJS+'spruit_sunrise_1k.hdr',
  'Room (procedural)':    null,
};
const rgbe = new RGBELoader();
const hdrCache = new Map();
function setEnvironment(name, showBg){
  const url = HDRI[name];
  const applyBg = (envTex, bgTex)=>{
    scene.environment = envTex;
    scene.background = showBg ? (bgTex || envTex) : gradBg;
  };
  if(!url){ applyBg(roomRT.texture, null); return; }
  if(hdrCache.has(url)){ const rt = hdrCache.get(url); applyBg(rt.texture, rt.texture); return; }
  rgbe.load(url, (hdr)=>{
    hdr.mapping = THREE.EquirectangularReflectionMapping;
    const rt = pmrem.fromEquirectangular(hdr);
    hdr.dispose();
    hdrCache.set(url, rt);
    applyBg(rt.texture, rt.texture);
  });
}

// ------------------------------------------------------------------ lights (identical in both modes)
const hemi = new THREE.HemisphereLight('#eaf1ff', '#141c2b', 0.9); scene.add(hemi);
const key = new THREE.DirectionalLight('#fff4e6', 2.3);
key.position.set(9, 16, 8); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -0.0002;
key.shadow.camera.near = 1; key.shadow.camera.far = 90;
key.shadow.camera.left = -28; key.shadow.camera.right = 28;
key.shadow.camera.top = 28; key.shadow.camera.bottom = -28;
scene.add(key);
const fill = new THREE.DirectionalLight('#9db8ff', 0.9); fill.position.set(-10, 8, -6); scene.add(fill);
const rim = new THREE.SpotLight('#37e0d0', 220, 44, 0.6, 0.8); rim.position.set(-6, 9, 10); scene.add(rim);
const accent = new THREE.PointLight('#ff8c42', 40, 40); accent.position.set(8, 3, -8); scene.add(accent);

// ------------------------------------------------------------------ palette
const COL = { steel:'#6b7688', dark:'#3a4250', casing:'#8c97a6', pipe:'#7d8798',
              painted:'#c85a3c', copper:'#b7734a', concrete:'#5a6070', teal:'#37e0d0' };

// ------------------------------------------------------------------ live params
const TONE = {
  AgX: THREE.AgXToneMapping, ACES: THREE.ACESFilmicToneMapping,
  Neutral: THREE.NeutralToneMapping, Reinhard: THREE.ReinhardToneMapping,
  Cineon: THREE.CineonToneMapping, Linear: THREE.LinearToneMapping,
};
const P = {
  env:'Spruit sunrise', showBg:true, stage:true, powerlines:true,
  tone:'AgX', exposure:0.53, envIntensity:3, normalScale:3,
  physical:true, anisotropy:1.0, clearcoat:1.0, steelRough:1.0, paintedRough:0.52,
  floorGlossy:true, floorMetal:1.0, floorRough:0.12,
  aoOn:false, aoRadius:0.6, aoScale:1.2, aoSamples:16, aoIntensity:1.3,
  bloomOn:false, bloomStrength:0.28, bloomRadius:0.37, bloomThreshold:1.0,
  smaa:true, vignette:true, vigOffset:0.95, vigDark:1.19,
  spin:true, spinSpeed:0.18, beacon:1.8,
  sensorsOn:true, alertsOn:true,
};
const PRESET = {
  current:  { env:'Room (procedural)', showBg:false, tone:'ACES', exposure:1.08, envIntensity:0.9, normalScale:1.0, physical:false, anisotropy:0, clearcoat:0,
              steelRough:1.0, paintedRough:1.0, floorGlossy:false, floorMetal:0.1, floorRough:0.9,
              aoOn:false, aoRadius:0.4, aoScale:0.9, aoSamples:8, aoIntensity:1.0,
              bloomStrength:0.5, bloomRadius:0.72, bloomThreshold:0.85, smaa:false, vignette:false, beacon:1.1 },
  enhanced: { env:'Spruit sunrise', showBg:true, tone:'AgX', exposure:0.53, envIntensity:3, normalScale:3, physical:true, anisotropy:1.0, clearcoat:1.0,
              steelRough:1.0, paintedRough:0.52, floorGlossy:true, floorMetal:1.0, floorRough:0.12,
              aoOn:false, aoRadius:0.6, aoScale:1.2, aoSamples:16, aoIntensity:1.3,
              bloomStrength:0.28, bloomRadius:0.37, bloomThreshold:1.0, smaa:true, vignette:true, vigDark:1.19, beacon:1.8 },
};

// ------------------------------------------------------------------ real PBR texture sets (same maps the web app ships)
const texLoader = new THREE.TextureLoader();
const TBASE = 'public/textures';
const texCache = new Map();
function loadTex(set, map, srgb, rx, ry){
  const key = `${set}/${map}@${rx}x${ry}`;
  if(texCache.has(key)) return texCache.get(key);
  const t = texLoader.load(`${TBASE}/${set}/${map}.jpg`);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  t.anisotropy = 8; t.repeat.set(rx, ry);
  texCache.set(key, t); return t;
}
function texSet(set, rx, ry, hasMetal=true){
  const f = { map: loadTex(set,'color',true,rx,ry),
              normalMap: loadTex(set,'normal',false,rx,ry),
              roughnessMap: loadTex(set,'rough',false,rx,ry) };
  if(hasMetal) f.metalnessMap = loadTex(set,'metal',false,rx,ry);
  return f;
}
// matKey -> texture set + tiling
const TEX = {
  steel:   ()=>texSet('steel', 3, 2),
  dark:    ()=>texSet('dark', 3, 2),
  casing:  ()=>texSet('plates', 2, 2),
  pipe:    ()=>texSet('steel', 5, 1),
  painted: ()=>texSet('painted', 1.6, 1.6),
  concrete:()=>texSet('concrete', 6, 6, false),
};

// materials rebuilt when the physical/standard class changes; live props via applyLive()
let MATS = {};
function buildMaterials() {
  Object.values(MATS).forEach(m => m.dispose && m.dispose());
  const envI = P.envIntensity, nS = P.normalScale;
  function make(setKey, { metalness=1, roughness=1, phys=false, physProps={} } = {}){
    const frag = TEX[setKey] ? TEX[setKey]() : {};
    const base = { envMapIntensity:envI, metalness, roughness, ...frag };
    const m = (P.physical && phys)
      ? new THREE.MeshPhysicalMaterial({ ...base, ...physProps })
      : new THREE.MeshStandardMaterial(base);
    if(m.normalMap) m.normalScale.set(nS, nS);
    return m;
  }
  MATS = {
    steel:   make('steel',   { metalness:1, roughness:P.steelRough, phys:true,
                               physProps:{ anisotropy:P.anisotropy, anisotropyRotation:Math.PI/2 } }),
    dark:    make('dark',    { metalness:1, roughness:1 }),
    casing:  make('casing',  { metalness:1, roughness:1 }),
    pipe:    make('pipe',    { metalness:1, roughness:0.9 }),
    painted: make('painted', { metalness:1, roughness:P.paintedRough, phys:true,
                               physProps:{ clearcoat:P.clearcoat, clearcoatRoughness:0.2 } }),
    copper:  new THREE.MeshStandardMaterial({ color:COL.copper, metalness:0.9, roughness:0.4, envMapIntensity:envI }),
    concrete:make('concrete',{ metalness:0, roughness:1 }),
    grating: make('casing',  { metalness:1, roughness:0.6 }),
    yellow:  new THREE.MeshStandardMaterial({ color:'#e8b21a', metalness:0.3, roughness:0.6, envMapIntensity:envI }),
    hot:     new THREE.MeshStandardMaterial({ color:COL.teal, emissive:COL.teal,
                    emissiveIntensity:P.beacon, toneMapped:false }),
  };
}
function applyMaterialsToParts(){ parts.forEach(p => { if(MATS[p.matKey]) p.m.material = MATS[p.matKey]; }); }

// ------------------------------------------------------------------ equipment (power-plant skid)
const rig = new THREE.Group(); scene.add(rig);
function mesh(geo, mat, x,y,z, rx=0,ry=0,rz=0){
  const m = new THREE.Mesh(geo, mat); m.position.set(x,y,z); m.rotation.set(rx,ry,rz);
  m.castShadow = true; m.receiveShadow = true; rig.add(m); return m;
}
const parts = []; // {mesh, matKey}
function addPart(geo, matKey, x,y,z, rx=0,ry=0,rz=0){
  const m = mesh(geo, MATS[matKey], x,y,z, rx,ry,rz); parts.push({m, matKey}); return m;
}
function buildEquipment(){
  rig.clear(); parts.length = 0;
  // skid base (concrete)
  addPart(new THREE.BoxGeometry(11, 0.5, 5), 'concrete', 0, 0.25, 0);
  // turbine body (brushed steel cylinder)
  addPart(new THREE.CylinderGeometry(1.5, 1.5, 6.4, 40), 'steel', -1.6, 2.4, 0, 0,0,Math.PI/2);
  addPart(new THREE.CylinderGeometry(1.62,1.62,0.25,40), 'dark', -4.7, 2.4, 0, 0,0,Math.PI/2);
  addPart(new THREE.CylinderGeometry(1.62,1.62,0.25,40), 'dark',  1.5, 2.4, 0, 0,0,Math.PI/2);
  // casing ribs
  for(let i=0;i<5;i++) addPart(new THREE.TorusGeometry(1.53,0.06,10,40),'casing', -4.2+i*1.4, 2.4, 0, 0,Math.PI/2,0);
  // generator box (painted, clearcoat)
  addPart(new THREE.BoxGeometry(3.4, 2.6, 3.0), 'painted', 3.6, 2.05, 0);
  addPart(new THREE.BoxGeometry(3.5, 0.3, 3.1), 'dark', 3.6, 3.4, 0);
  // control cabinet
  addPart(new THREE.BoxGeometry(1.2, 2.0, 1.0), 'painted', 3.6, 1.75, 2.6);
  // stack
  addPart(new THREE.CylinderGeometry(0.5, 0.62, 6.0, 24), 'casing', -4.2, 5.2, -1.6);
  addPart(new THREE.TorusGeometry(0.5,0.08,10,24), 'dark', -4.2, 8.1, -1.6, Math.PI/2,0,0);
  // pipes weaving across
  const pipe = (x,y,z,len,axis)=>{ const g=new THREE.CylinderGeometry(0.16,0.16,len,16);
    addPart(g,'pipe',x,y,z, axis==='x'?0:0, 0, axis==='x'?Math.PI/2:0); };
  pipe(-1.5, 0.9, 2.1, 8.5, 'x'); pipe(-1.5, 0.9, -2.1, 8.5, 'x');
  for(const zx of [2.1,-2.1]){ addPart(new THREE.CylinderGeometry(0.16,0.16,1.0,16),'pipe', 2.6,1.4,zx); }
  // copper junctions + emissive gauges
  addPart(new THREE.BoxGeometry(0.4,0.6,0.4),'copper', 2.6, 1.9, 2.1);
  addPart(new THREE.SphereGeometry(0.5,24,24), 'hot', 5.55, 4.4, 0); // status beacon
  addPart(new THREE.CylinderGeometry(0.05,0.05,1.6,10),'pipe', 5.55, 3.5, 0);
  // railing
  for(let i=0;i<=10;i++) addPart(new THREE.CylinderGeometry(0.03,0.03,1.0,8),'dark', -5+i, 1.0, 2.45);
  addPart(new THREE.BoxGeometry(11,0.05,0.05),'dark', 0, 1.5, 2.45);
  rig.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; } });
}

// ------------------------------------------------------------------ industrial STAGE / set dressing
// Concrete pad, painted safety markings, structural steel columns, an overhead
// pipe rack, a grating mezzanine + handrails, and background tanks — so the
// boiler reads as a real plant install rather than a model on a grey plane.
const stageGroup = new THREE.Group(); scene.add(stageGroup);
function sPart(geo, matKey, x,y,z, rx=0,ry=0,rz=0){
  const m = new THREE.Mesh(geo, MATS[matKey] || MATS.dark);
  m.position.set(x,y,z); m.rotation.set(rx,ry,rz);
  m.castShadow = true; m.receiveShadow = true;
  stageGroup.add(m); parts.push({m, matKey}); return m;
}
// I-beam column: web + two flanges, painted structural steel
function column(x, z, h){
  const fl = 0.7, th = 0.09, y = h/2;
  sPart(new THREE.BoxGeometry(th, h, fl*2), 'dark', x, y, z);          // web
  sPart(new THREE.BoxGeometry(fl, h, th), 'dark', x, y, z-fl+th/2);    // flange
  sPart(new THREE.BoxGeometry(fl, h, th), 'dark', x, y, z+fl-th/2);    // flange
  sPart(new THREE.BoxGeometry(fl*1.6, 0.12, fl*1.6), 'dark', x, 0.06, z); // base plate
}
function buildStage(){
  // clear previous stage parts from parts[] and group
  const keep = parts.filter(p => !stageGroup.children.includes(p.m));
  parts.length = 0; keep.forEach(p=>parts.push(p));
  stageGroup.clear();

  // --- concrete pad (equipment sits on top at y=0) ---
  sPart(new THREE.BoxGeometry(22, 0.6, 13), 'concrete', 0, -0.30, 0);
  // curb edge
  sPart(new THREE.BoxGeometry(22, 0.12, 0.4), 'concrete', 0, 0.06, 6.3);
  sPart(new THREE.BoxGeometry(22, 0.12, 0.4), 'concrete', 0, 0.06, -6.3);

  // --- painted safety markings on the pad (yellow border + hazard walkway) ---
  const stripeY = 0.011;
  sPart(new THREE.BoxGeometry(20.4, 0.02, 0.28), 'yellow', 0, stripeY, 5.7);
  sPart(new THREE.BoxGeometry(20.4, 0.02, 0.28), 'yellow', 0, stripeY, -5.7);
  sPart(new THREE.BoxGeometry(0.28, 0.02, 11.4), 'yellow', 10.06, stripeY, 0);
  sPart(new THREE.BoxGeometry(0.28, 0.02, 11.4), 'yellow', -10.06, stripeY, 0);
  // hazard walkway chevrons down one side
  for(let i=-4;i<=4;i++) sPart(new THREE.BoxGeometry(1.1, 0.02, 0.16), 'yellow', -7.5, stripeY, i*0.9, 0, Math.PI/5, 0);

  // --- structural steel columns around the perimeter ---
  const H = 12;
  for(const x of [-9.5, 0, 9.5]) for(const z of [-5.6, 5.6]) column(x, z, H);
  // --- overhead pipe-rack frame ---
  for(const z of [-5.6, 5.6]) sPart(new THREE.BoxGeometry(19.6, 0.45, 0.5), 'dark', 0, H-0.4, z);
  for(const x of [-9.5, 0, 9.5]) sPart(new THREE.BoxGeometry(0.5, 0.45, 11.6), 'dark', x, H-0.4, 0);
  // pipes running along the rack
  const rackPipes = [ {z:-3.6, m:'pipe', r:0.24}, {z:-1.8, m:'painted', r:0.3},
                      {z:0.2, m:'casing', r:0.35}, {z:2.2, m:'pipe', r:0.22}, {z:4.0, m:'painted', r:0.26} ];
  rackPipes.forEach(p=> sPart(new THREE.CylinderGeometry(p.r, p.r, 19.4, 18), p.m, 0, H-0.95, p.z, 0,0,Math.PI/2));
  // vertical drops from a couple of pipes into the equipment area
  sPart(new THREE.CylinderGeometry(0.22,0.22, H-1.6, 14), 'painted', 8.4, (H-1.6)/2+0.2, -1.8);
  sPart(new THREE.CylinderGeometry(0.26,0.26, H-3.0, 14), 'casing', -8.6, (H-3.0)/2+0.2, 0.2);

  // --- grating mezzanine platform on one side, with handrail ---
  const px = 7.4, pyH = 4.2, pzHalf = 5;
  sPart(new THREE.BoxGeometry(3.6, 0.14, pzHalf*2), 'grating', px, pyH, 0);
  for(const z of [-pzHalf, pzHalf]) sPart(new THREE.BoxGeometry(3.6, 0.25, 0.16), 'dark', px, pyH-0.2, z); // edge beams
  // handrail posts + rails on the outer edge
  for(let i=-4;i<=4;i++) sPart(new THREE.CylinderGeometry(0.045,0.045,1.0,8), 'dark', px+1.7, pyH+0.5, i*1.1);

  for(const z of [-3.5, 3.5]) column(px, z, pyH-0.1);

  sPart(new THREE.CylinderGeometry(2.0, 2.0, 6.5, 24), 'painted', 15.8, 3.35, -4.5);

// ------------------------------------------------------------------ transmission lines / power infrastructure
// Lattice steel towers marching to the horizon with sagging conductor lines, plus
// distribution poles feeding the yard — the "outdoors in the middle of nowhere with
// powerlines everywhere" setting.
const powerGroup = new THREE.Group(); scene.add(powerGroup);
const _up = new THREE.Vector3(0,1,0);
function strut(a, b, r, matKey){
  const va = new THREE.Vector3(a[0],a[1],a[2]), vb = new THREE.Vector3(b[0],b[1],b[2]);
  const dir = new THREE.Vector3().subVectors(vb, va); const len = dir.length();
  if(len < 1e-4) return;
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 6), MATS[matKey] || MATS.dark);
  m.position.copy(va).addScaledVector(dir, 0.5);
  m.quaternion.setFromUnitVectors(_up, dir.normalize());
  m.castShadow = false; m.receiveShadow = false;
  powerGroup.add(m); parts.push({m, matKey});
}
function conductor(p1, p2, sag, r){
  const a=new THREE.Vector3(p1[0],p1[1],p1[2]), b=new THREE.Vector3(p2[0],p2[1],p2[2]);
  const mid=new THREE.Vector3().addVectors(a,b).multiplyScalar(0.5); mid.y -= sag;
  const curve=new THREE.QuadraticBezierCurve3(a, mid, b);
  const m=new THREE.Mesh(new THREE.TubeGeometry(curve, 18, r, 5, false), MATS.dark);
  m.castShadow=false; m.receiveShadow=false;
  powerGroup.add(m); parts.push({m, matKey:'dark'});
}
// A lattice tower centered at (cx,cz), height H. Conductors run along `axis`
// ('x' or 'z'); cross-arms extend perpendicular. Returns world attach points.
function latticeTower(cx, cz, H, axis){
  const bw=2.0, tw=0.5, legR=0.11;
  const corners=[[-1,-1],[1,-1],[1,1],[-1,1]];
  const at=(sx,sz,y)=>{ const w=bw+(tw-bw)*(y/H); return [cx+sx*w, y, cz+sz*w]; };
  // legs
  corners.forEach(([sx,sz])=> strut(at(sx,sz,0), at(sx,sz,H), legR, 'dark'));
  // horizontal belts
  const belts=[0.12,0.32,0.55,0.78,0.95].map(t=>t*H);
  belts.forEach(y=>{ for(let i=0;i<4;i++){ const [sx,sz]=corners[i], [nx,nz]=corners[(i+1)%4];
    strut(at(sx,sz,y), at(nx,nz,y), 0.06, 'dark'); } });
  // X-bracing on the two faces parallel to the line (silhouette)
  for(let s=0;s<belts.length-1;s++){ const y0=belts[s], y1=belts[s+1];
    for(const side of [[-1,-1,1,-1],[-1,1,1,1]]){ // front & back faces
      strut(at(side[0],side[1],y0), at(side[2],side[3],y1), 0.045, 'dark');
      strut(at(side[2],side[3],y0), at(side[0],side[1],y1), 0.045, 'dark'); } }
  // cross-arms + insulators + attach points
  const perp = axis==='x' ? 'z' : 'x';
  const arm=(y, len)=>{
    const a1 = perp==='z' ? [cx, y, cz-len] : [cx-len, y, cz];
    const a2 = perp==='z' ? [cx, y, cz+len] : [cx+len, y, cz];
    strut([cx,y,cz], a1, 0.09, 'dark'); strut([cx,y,cz], a2, 0.09, 'dark');
    // insulator strings hang down; conductors attach at their bottom
    const ins=(p)=>{ const b=[p[0], p[1]-0.7, p[2]];
      strut(p, b, 0.06, 'casing'); return b; };
    return [ins(a1), ins(a2)];
  };
  const lower = arm(H*0.80, 5.5);
  const upper = arm(H*0.92, 4.0);
  const ground = [cx, H+0.2, cz];               // shield/ground wire at the peak
  return { pts: [...lower, ...upper], ground };
}
function poleLine(cx, cz, H){                     // simple distribution pole + crossarm
  strut([cx,0,cz],[cx,H,cz], 0.16, 'dark');
  strut([cx,H-0.6,cz-1.4],[cx,H-0.6,cz+1.4], 0.09, 'dark');
  const a=[cx,H-0.7,cz-1.4], b=[cx,H-0.7,cz+1.4];
  return { pts:[a,b], ground:[cx,H,cz] };
}
function buildPowerlines(){
  // keep non-power parts, clear the power group
  const keep = parts.filter(p => !powerGroup.children.includes(p.m));
  parts.length = 0; keep.forEach(p=>parts.push(p));
  powerGroup.clear();

  // --- Main transmission line marching to the horizon (behind the plant) ---
  const lineA = [[-45,-34],[10,-36],[70,-40],[145,-46]].map(([x,z])=> latticeTower(x, z, 30, 'x'));
  for(let i=0;i<lineA.length-1;i++){ const A=lineA[i], B=lineA[i+1];
    const span = Math.abs(B.ground[0]-A.ground[0]); const sag = Math.min(6, span*0.07);
    for(let k=0;k<A.pts.length;k++) conductor(A.pts[k], B.pts[k], sag, 0.05);
    conductor(A.ground, B.ground, sag*0.8, 0.04); }

  // --- Branch line crossing on another side (visible as you orbit) ---
  const lineB = [[48,-30],[52,15],[58,60]].map(([x,z])=> latticeTower(x, z, 26, 'z'));
  for(let i=0;i<lineB.length-1;i++){ const A=lineB[i], B=lineB[i+1];
    const span = Math.abs(B.ground[2]-A.ground[2]); const sag = Math.min(5, span*0.07);
    for(let k=0;k<A.pts.length;k++) conductor(A.pts[k], B.pts[k], sag, 0.05);
    conductor(A.ground, B.ground, sag*0.8, 0.04); }

  // --- Distribution poles feeding the yard, with a service drop toward the skid ---
  const p1 = poleLine(-22, 9, 9);
  const p2 = poleLine(-22, -7, 9);
  conductor(p1.pts[0], p2.pts[0], 0.8, 0.035);
  conductor(p1.pts[1], p2.pts[1], 0.8, 0.035);
  conductor(p2.pts[1], [-11, 4.2, -1], 0.5, 0.03);   // drop into the plant

  powerGroup.visible = P.powerlines;
}

// ------------------------------------------------------------------ sensor tags + values + animated alerts
// Named sensor points on the equipment with live (synthetic) readings. Levels are
// computed from value vs thresholds every frame; problem areas glow + pulse red —
// matching the web app's ALERT model (ok/watch/critical).
const ALERT = {
  ok:       { color:'#35d69a', glow:'rgba(53,214,154,.45)' },
  watch:    { color:'#ffcc4d', glow:'rgba(255,204,77,.5)' },
  critical: { color:'#ff5470', glow:'rgba(255,84,112,.6)' },
};
// pos = 3D anchor on the skid; base/amp drive a slow synthetic reading; warn/crit are thresholds.
const SENSORS = [
  { id:'speed',  label:'Rotor Speed',       pos:[-1.6, 4.2, 0],  units:'RPM',  dec:0, base:3600, amp:8,   period:5,  warn:3625, crit:3660 },
  { id:'fvib',   label:'Front Bearing Vib',  pos:[-4.9, 2.6, 0],  units:'mils', dec:2, base:3.4,  amp:2.6, period:7,  warn:3.5,  crit:4.5,  bad:true },
  { id:'gbrg',   label:'Gen Bearing Temp',   pos:[1.7, 2.8, 0],   units:'°F',   dec:0, base:196,  amp:10,  period:9,  warn:190,  crit:210 },
  { id:'load',   label:'Generator Load',     pos:[3.6, 3.7, 0],   units:'MW',   dec:1, base:512,  amp:14,  period:11, warn:560,  crit:585 },
  { id:'wind',   label:'Winding Temp',       pos:[3.6, 3.0, 2.7], units:'°F',   dec:0, base:250,  amp:14,  period:8,  warn:275,  crit:300 },
  { id:'steam',  label:'Main Steam Temp',    pos:[-4.2, 7.2, -1.6], units:'°F', dec:0, base:1002, amp:6,   period:10, warn:1015, crit:1025 },
];
const sensorGroup = new THREE.Group(); scene.add(sensorGroup);
const sensorRefs = [];
function levelFor(v, s){ return v >= s.crit ? 'critical' : (v >= s.warn ? 'watch' : 'ok'); }
function fmtVal(v, dec){ return v.toLocaleString(undefined,{minimumFractionDigits:dec, maximumFractionDigits:dec}); }
function buildSensors(){
  sensorGroup.clear(); sensorRefs.length = 0;
  const labelsHost = document.getElementById('labels');
  labelsHost.querySelectorAll('.sensor-lbl').forEach(e=>e.remove());
  for(const s of SENSORS){
    const g = new THREE.Group(); g.position.set(s.pos[0], s.pos[1], s.pos[2]); sensorGroup.add(g);
    // marker + ring (billboard-ish flat ring faces camera via lookAt each frame)
    const marker = new THREE.Mesh(new THREE.SphereGeometry(0.14, 16, 16),
      new THREE.MeshBasicMaterial({ color:'#eef4fb', toneMapped:false }));
    const ring = new THREE.Mesh(new THREE.RingGeometry(0.22, 0.29, 24),
      new THREE.MeshBasicMaterial({ color:ALERT.ok.color, toneMapped:false, transparent:true, opacity:0.8, side:THREE.DoubleSide }));
    // hotzone pulsing sphere for problems
    const hot = new THREE.Mesh(new THREE.SphereGeometry(1.0, 20, 20),
      new THREE.MeshBasicMaterial({ color:ALERT.critical.color, toneMapped:false, transparent:true, opacity:0.16, depthWrite:false }));
    hot.visible = false;
    g.add(hot); g.add(marker); g.add(ring);
    // leader stub
    const leaderMat = new THREE.LineBasicMaterial({ color:ALERT.ok.color, transparent:true, opacity:0.7 });
    const leader = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0.95,0)]), leaderMat);
    g.add(leader);
    // DOM label via CSS2DObject
    const el = document.createElement('div'); el.className = 'sensor-lbl';
    el.innerHTML = `<div class="nm"><span class="dot"></span>${s.label}</div><div class="val">—</div>`;
    const label = new CSS2DObject(el); label.position.set(0, 1.05, 0); g.add(label);
    sensorRefs.push({ s, g, marker, ring, hot, leader, el, valEl: el.querySelector('.val'), dotEl: el.querySelector('.dot') });
  }
  sensorGroup.visible = P.sensorsOn;
}
function updateSensors(t){
  if(!P.sensorsOn) return;
  for(const r of sensorRefs){
    const s = r.s;
    // synthetic reading (bad sensor sweeps up into critical periodically)
    let v = s.base + Math.sin(t/s.period + s.base) * s.amp + (Math.sin(t*3.1+s.base)*0.15*s.amp);
    if(s.bad) v = s.base + (0.5+0.5*Math.sin(t/s.period)) * s.amp * 1.15; // rides up into crit band
    let lvl = P.alertsOn ? levelFor(v, s) : 'ok';
    const a = ALERT[lvl];
    // update label
    r.valEl.textContent = `${fmtVal(v, s.dec)} ${s.units}`;
    r.el.style.borderColor = a.color;
    r.dotEl.style.background = a.color;
    r.el.classList.toggle('crit', lvl==='critical');
    if(lvl!=='critical') r.el.style.boxShadow = `0 0 8px ${a.glow}`;
    // marker/ring/leader colors
    r.ring.material.color.set(a.color);
    r.marker.material.color.set(lvl==='ok' ? '#eef4fb' : a.color);
    r.leader.material.color.set(a.color);
    // ring + hotzone billboard toward camera
    r.ring.lookAt(camera.position);
    // hotzone pulse for problems
    const problem = lvl==='watch' || lvl==='critical';
    r.hot.visible = problem;
    if(problem){
      r.hot.material.color.set(a.color);
      r.hot.material.opacity = lvl==='critical' ? 0.2 : 0.12;
      const base = lvl==='critical' ? 1.35 : 1.0;
      r.hot.scale.setScalar(base * (1 + Math.sin(t*2.4)*0.12));
    }
  }
}

// ------------------------------------------------------------------ floor (matte vs reflective)
let floor = null, contactShadow = null;
function buildFloor(){
  if(floor){ scene.remove(floor); floor.geometry.dispose(); floor.material.dispose(); floor = null; }
  floor = new THREE.Mesh(new THREE.PlaneGeometry(120,120),
    new THREE.MeshStandardMaterial({
      color: P.floorGlossy ? '#0f151d' : '#141b26',
      metalness: P.floorMetal, roughness: P.floorRough, envMapIntensity: P.envIntensity,
      polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 }));
  floor.rotation.x = -Math.PI/2; floor.position.y = -0.08; floor.receiveShadow = true; scene.add(floor);

    const rg=g.createRadialGradient(128,128,10,128,128,128);
    rg.addColorStop(0,'rgba(2,5,9,0.7)'); rg.addColorStop(1,'rgba(2,5,9,0)');

  }
}

// ------------------------------------------------------------------ composer / post (all passes always present; toggled + tuned live)
let composer, gtao, bloom, smaa, vign;
function buildComposer(){
  if(composer) composer.dispose();
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  // GTAO is opt-in: it's the heaviest pass and can corrupt on some GPU drivers
  // (ARM/integrated). Only added when AO is enabled, so the default is rock-solid.
  if(P.aoOn){
    gtao = new GTAOPass(scene, camera, innerWidth, innerHeight);
    gtao.output = GTAOPass.OUTPUT.Default;
    composer.addPass(gtao);
  } else gtao = null;
  bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), P.bloomStrength, P.bloomRadius, P.bloomThreshold);
  composer.addPass(bloom);
  vign = new ShaderPass(VignetteShader);
  composer.addPass(vign);
  smaa = new SMAAPass(innerWidth*devicePixelRatio, innerHeight*devicePixelRatio);
  composer.addPass(smaa);
  composer.addPass(new OutputPass());           // MUST be last: final tone-map + color space
  applyLive();
}

// push every param onto the live renderer / passes / materials — no rebuild needed
function applyLive(){
  renderer.toneMapping = TONE[P.tone]; renderer.toneMappingExposure = P.exposure;
  if(gtao){ gtao.enabled = P.aoOn; gtao.blendIntensity = P.aoIntensity;
    gtao.updateGtaoMaterial({ radius:P.aoRadius, scale:P.aoScale, samples:P.aoSamples }); }
  if(bloom){ bloom.enabled = P.bloomOn; bloom.strength = P.bloomStrength; bloom.radius = P.bloomRadius; bloom.threshold = P.bloomThreshold; }
  if(smaa){ smaa.enabled = P.smaa; }
  if(vign){ vign.enabled = P.vignette; vign.uniforms.offset.value = P.vigOffset; vign.uniforms.darkness.value = P.vigDark; }
  ['steel','dark','casing','pipe','painted','copper','concrete','grating','yellow'].forEach(k=>{ if(MATS[k]) MATS[k].envMapIntensity = P.envIntensity; });
  ['steel','dark','casing','pipe','painted','concrete','grating'].forEach(k=>{ const m=MATS[k]; if(m && m.normalMap) m.normalScale.set(P.normalScale, P.normalScale); });
  if(MATS.steel){ MATS.steel.roughness = P.steelRough; if('anisotropy' in MATS.steel) MATS.steel.anisotropy = P.anisotropy; }
  if(MATS.painted){ MATS.painted.roughness = P.paintedRough; if('clearcoat' in MATS.painted) MATS.painted.clearcoat = P.clearcoat; }
  if(floor){ floor.material.color.set(P.floorGlossy ? '#0f151d' : '#141b26');
    floor.material.metalness = P.floorMetal; floor.material.roughness = P.floorRough; floor.material.envMapIntensity = P.envIntensity; }
}
function rebuildMaterials(){ buildMaterials(); applyMaterialsToParts(); applyLive(); }

// WebGL context-loss recovery — rebuilds the GPU render targets (PMREM envs,
// composer passes) that a lost/restored context invalidates. This is the
// "randomly loses picture / smeared streaks" fix.
let glOK = true;
renderer.domElement.addEventListener('webglcontextlost', (e)=>{ e.preventDefault(); glOK = false; }, false);
renderer.domElement.addEventListener('webglcontextrestored', ()=>{
  // rebuild PMREM environments (their render targets are gone)
  pmrem.compileEquirectangularShader();
  try { roomRT = pmrem.fromScene(new RoomEnvironment(), 0.04); } catch(_) {}
  hdrCache.clear();
  buildMaterials(); applyMaterialsToParts(); buildFloor();
  buildComposer(); setEnvironment(P.env, P.showBg); applyLive();
  glOK = true;
}, false);

const clock = new THREE.Clock();
renderer.setAnimationLoop(()=>{
  if(!glOK) return;                       // skip frames while context is lost
  const t = clock.getElapsedTime();
  // Orbit the CAMERA (not the model) so the plant set stays put and reads as a real site.
  controls.autoRotate = P.spin;
  controls.autoRotateSpeed = P.spinSpeed * 6;
  if(MATS.hot){ MATS.hot.emissiveIntensity = P.beacon * (0.75 + 0.25*Math.sin(t*2.2)); }
  updateSensors(t);
  controls.update();
  composer.render();
  labelRenderer.render(scene, camera);
});
</script>
</body>
</html>
